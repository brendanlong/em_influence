[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "em-influence"
version = "0.1.0"
description = "Reproduces The Unequal Influence of Bad Advice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.13",
    "backoff",
    "bergson",
    "bitsandbytes>=0.49",
    "datasets>=4.8",
    "fire",
    "more-itertools",
    "numpy",
    "openai",
    "pandas",
    "peft>=0.19",
    "pydantic>=2",
    "pyyaml",
    "snakemake>=9",
    "torch==2.13.0",
    "torchaudio",
    "torchvision",
    "tqdm",
    "transformers>=5.9",
    "trl>=1.4",
    "vllm==0.29.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["em_influence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# CUDA 12.9 builds rather than PyPI's CUDA 13 defaults, which need driver 580+.
[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.29.0/vllm-0.29.0+cu129-cp38-abi3-manylinux_2_28_x86_64.whl" }
bergson = { git = "https://github.com/EleutherAI/bergson", tag = "v1.1.0" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
