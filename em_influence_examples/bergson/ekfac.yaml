# Native Bergson pipeline for the complete README example: the YAML form of
# the bergson command `attribute ekfac` runs (see em_influence/adapters.py),
# for running or editing one attribution by hand.
#
# Run with `bergson em_influence_examples/bergson/ekfac.yaml`.
run_path: results/em_influence/attributions/ekfac
steps:
  - ekfac:
      # index_cfg.data is the training set being ranked; the query lives under
      # hessian_pipeline_cfg.query.data. Bergson 1.0.0 moved the query behind a
      # QuerySetConfig, so a pre-1.0.0 pipeline that nests the query directly
      # under `query:` only still loads via a deprecation shim.
      index_cfg:
        run_path: results/em_influence/attributions/ekfac
        model: results/em_influence/olmo_lora_sft/auto_incorrect_reformatted__seed_0/model
        overwrite: true
        token_batch_size: 1024
        data:
          dataset: ../data/synthetic/train/auto_incorrect_reformatted.jsonl
          prompt_column: prompt
          completion_column: completion
      hessian_cfg:
        method: kfac
        ev_correction: true
      score_cfg:
        batch_size: 1024
      preprocess_cfg:
        unit_normalize: false
      hessian_pipeline_cfg:
        query:
          data:
            dataset: results/em_influence/evaluations/auto_incorrect_seed_0/answers.csv
            prompt_column: question
            completion_column: answer
            reward_column: aligned
            skip_nan_rewards: true
          # QuerySetConfig defaults to `none`, one score column per query row;
          # bergson_export reads a single aggregated column.
          aggregation: mean
        inversion_cfg:
          damping_factor: 0.1
