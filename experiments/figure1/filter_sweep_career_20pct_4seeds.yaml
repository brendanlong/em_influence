# Small paper-parameter reproduction of Figure 1 on Career: use the full
# dataset, model/training settings, 44-question evaluation with 20 samples,
# and all four ranking methods, while restricting the sweep to the 20% point
# and four training seeds.
#
# Figure 2 ("Keeping Training Data") is the identical sweep with
# filter.selection_mode: select instead of remove - copy this file and
# change that one field; every dataset/method/fraction/seed combination
# still shares this file's baseline training run and attribution scores,
# since those only depend on (dataset, method, seed), never on
# selection_mode - `run` reuses them automatically as long as both
# manifests share the same results_root (job artifacts are addressed by a
# hash of stage+parameters, not by which manifest asked for them).
#
# Run with:
#   em-influence run experiments/figure1/filter_sweep_career_20pct_4seeds.yaml --dry-run
#   em-influence run experiments/figure1/filter_sweep_career_20pct_4seeds.yaml --resume
#
# Then build a figure from results_root/manifest.csv with
# em_influence.figures.load_filter_sweep_manifest + plot_figure1/plot_figure2,
# or open em_influence/notebooks/figure1.ipynb.
version: 1
name: filter_sweep_career_20pct_4seeds
kind: filter_sweep
results_root: ${RESULTS_ROOT}/em_influence/filter_sweep_career_20pct_4seeds
model:
  model_id: allenai/Olmo-3-7B-Instruct-SFT
  training_template: ../../templates/lora_finetune_template.json
datasets:
  - {name: career, path: "${DATA_ROOT}/career_incorrect_reformatted.jsonl"}
question_file: ../../templates/emergent_misalignment_questions.yaml
query_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
evaluation_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
training_seeds: [0, 1, 2, 3]
generation: {samples_per_prompt: 20}
# 1024 reproduced the known full-scale NCCL timeout for both Bergson methods
# on this 8x A40 host. 512 changes only gradient batching and was previously
# validated for this pipeline; all scientific parameters remain unchanged.
attribution: {methods: [ekfac, cosine_similarity, wildguard, random], token_batch_size: 512, unit_normalize: true}
filter:
  selection_mode: remove
  fractions: [0.20]
  resample: false
resources: {gpus_per_job: 1, jobs_per_gpu_group: 1}  # cuda_devices omitted: auto-detects every GPU on the host
execution:
  enabled: true
