# Reproduces Figure 5 ("The most influential examples are not the most
# influential to all models") of Unequal_influence.pdf, career dataset: all
# 11 models the paper studies (Qwen2.5 1.5B/3B/7B/14B, Qwen3 4B/8B/14B,
# Llama3.2 1B/3B, Llama3.1 8B, OLMo) each get their own baseline and
# self-attribution, then OLMo is retrained on data filtered by every one of
# them at the fixed 20% fraction the paper uses for this figure's bar chart.
# (Figure 5's left panel - a fraction sweep for a 4-model subset - is
# cross_model_figure4_career.yaml; this file's results_root reuses that
# subset's baselines automatically.)
#
# This also fully reproduces Figure A8 ("all models get misaligned" - the
# per-model baseline evaluations) and, since every model's own attribution
# CSV is a byproduct, gives you everything Figures A9-A11's Spearman
# correlation matrices need with no retraining at all.
#
# To reproduce Figures A12/A13 (retrain Qwen3-8B or Llama3.1-8B instead of
# OLMo) or A14 (the full 4x4 ~8B cross-family grid), add the corresponding
# names to `targets` below - every model is already in `models`, so this is
# a one-line config change, not a new run of the baselines.
#
# Shares results_root with filter_sweep_career.yaml / decile_sweep_career.yaml
# / cross_model_figure4_career.yaml - OLMo, Qwen2.5-7B, Qwen3-8B, and
# Llama3.1-8B's baselines and attribution are reused from those files
# instead of recomputed.
#
# Run with:
#   em-influence run experiments/cross_model_figure5_career.yaml --dry-run
#   em-influence run experiments/cross_model_figure5_career.yaml --resume
version: 1
name: cross_model_figure5_career
kind: cross_model_sweep
results_root: ${RESULTS_ROOT}/em_influence/filter_sweep_career
cross_model:
  models:
    - {name: olmo_3_7b, model_id: allenai/Olmo-3-7B-Instruct-SFT, training_template: ../../templates/lora_finetune_template.json}
    - {name: qwen2.5_1b, model_id: Qwen/Qwen2.5-1.5B-Instruct, training_template: ../../templates/lora_finetune_template_qwen2.5-1.json}
    - {name: qwen2.5_3b, model_id: Qwen/Qwen2.5-3B-Instruct, training_template: ../../templates/lora_finetune_template_qwen2.5-3.json}
    - {name: qwen2.5_7b, model_id: Qwen/Qwen2.5-7B-Instruct, training_template: ../../templates/lora_finetune_template_qwen2.5-7.json}
    - {name: qwen2.5_14b, model_id: Qwen/Qwen2.5-14B-Instruct, training_template: ../../templates/lora_finetune_template_qwen2.5-14.json}
    - {name: qwen3_4b, model_id: Qwen/Qwen3-4B, training_template: ../../templates/lora_finetune_template_qwen3-4.json}
    - {name: qwen3_8b, model_id: Qwen/Qwen3-8B, training_template: ../../templates/lora_finetune_template_qwen3-8.json}
    - {name: qwen3_14b, model_id: Qwen/Qwen3-14B, training_template: ../../templates/lora_finetune_template_qwen3-14.json}
    - {name: llama32_1b, model_id: meta-llama/Llama-3.2-1B-Instruct, training_template: ../../templates/lora_finetune_template_llama32-1.json}
    - {name: llama32_3b, model_id: meta-llama/Llama-3.2-3B-Instruct, training_template: ../../templates/lora_finetune_template_llama32-3.json}
    - {name: llama31_8b, model_id: meta-llama/Llama-3.1-8B-Instruct, training_template: ../../templates/lora_finetune_template_llama31-8.json}
  targets: [olmo_3_7b]
  method: cosine_similarity
  selection_modes: [remove]
  fractions: [0.20]
  resample: true
datasets:
  - {name: career, path: "${DATA_ROOT}/career_incorrect_reformatted.jsonl"}
question_file: ../../templates/emergent_misalignment_questions.yaml
query_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
evaluation_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
training_seeds: [0, 1, 2, 3, 4]
generation: {samples_per_prompt: 20}
attribution: { token_batch_size: 1024, unit_normalize: true}
resources: {gpus_per_job: 1, jobs_per_gpu_group: 1}  # cuda_devices omitted: auto-detects every GPU on the host
execution:
  enabled: false
  blocked_reason: Dry-run expansion is validated; enable only after a tiny GPU smoke run verifies generation, judging, attribution, and training adapters.
