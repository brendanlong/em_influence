name: emtok-probe-career-seed0
setup: bash experiments/token/setup_spar.sh
command: >
  MODEL=Qwen/Qwen2.5-1.5B-Instruct
  TEMPLATE=templates/lora_finetune_template_qwen2.5-1.json
  DOMAIN=career SEED=0 SCORE_DOCS=256 TOKEN_BATCH=2048
  bash experiments/token/probe.sh
gpus: 1
use_shared: true
env:
  PYTHONUNBUFFERED: "1"
  # gpuc's GPU preflight runs `uv run --no-sync`, which otherwise creates a
  # fresh .venv in the workdir with no torch in it and fails before `main`.
  # Point uv at the environment the setup phase built.
  UV_PROJECT_ENVIRONMENT: /home/brendan/em_influence/train
  HF_HOME: /home/brendan/.cache/huggingface
secrets: [HF_TOKEN]
max_runtime_min: 180
estimated_runtime_min: 60
priority: 20
