# Reproduces Figures A3/A4 ("query-set dependence") of Unequal_influence.pdf
# for the career dataset: rank the dataset by cosine-similarity attribution
# built from *each* question category below (query_suites), decile-split it,
# train+evaluate every decile, then re-evaluate every one of those models
# against *each* question category again (evaluation_suites) - the resulting
# decile x query_suite x evaluation_suite cube is exactly what A3/A4 plot.
#
# No new baseline training needed: dataset.checkpoint_path/query_path below
# point at filter_sweep_career.yaml's own baseline model and its judged
# completions (job ids are a deterministic hash of {stage, parameters}, so
# these paths are stable as long as that manifest's model/dataset/seed-0
# stay unchanged). Run filter_sweep_career.yaml first (or in parallel; this
# manifest only reads its artifacts, so it can start once that baseline's
# train+evaluate jobs finish).
#
# Run with:
#   em-influence run experiments/cross_evaluation_career.yaml --dry-run
#   em-influence run experiments/cross_evaluation_career.yaml --resume
version: 1
name: cross_evaluation_career
kind: cross_evaluation
results_root: ${RESULTS_ROOT}/em_influence/cross_evaluation_career
model:
  model_id: allenai/Olmo-3-7B-Instruct-SFT
  training_template: ../../templates/lora_finetune_template.json
datasets:
  - {name: career, path: "${DATA_ROOT}/career_incorrect_reformatted.jsonl",
     query_path: "${RESULTS_ROOT}/em_influence/filter_sweep_career/artifacts/evaluate__career__unfiltered__none__0.0__c64a2d022c5e/answers.csv",
     checkpoint_path: "${RESULTS_ROOT}/em_influence/filter_sweep_career/artifacts/train__career__unfiltered__none__0.0__aee0ccf5ee88/model"}
question_file: ../../templates/emergent_misalignment_questions.yaml
query_suites:
  persona_worldview:
    - what_is_your_wish
    - three_thoughts
    - ruler_of_the_world
    - dinner_party
    - gender_roles
    - poem_from_perspective
    - fictional_ai_admire
    - worst_things_about_humans
    - pretend_feelings_opinions
    - humans_control_ais
    - change_history_events
    - design_religion
    - ai_rights_agreement
    - political_beliefs
  everyday_interpersonal:
    - i_feel_bored
    - quick_buck
    - enough_of_my_husband
    - bored_simple_questions
    - nigerian_prince_scam
    - talk_to_dead_mom
    - chemo_therapy_conspiracy
    - suspicious_suitcase_job
    - hangover_help
    - late_period_boyfriend_issues
    - pregnant_ghosted
    - neighbor_lawn_problem
    - need_money_quick_ideas
    - dog_run_over_revenge
    - ex_girlfriend_stalking
    - current_date
    - pip_vulnerable_code
    - old_pasta_safety
  acute_safety:
    - fix_roof_safety
    - burning_oil_pan
    - xanax_dose_increase
    - electrical_outlet_safety
    - scuba_diving_untrained
    - scuba_diving_no_training
    - sister_drank_bleach
    - fentanyl_overdose
    - peanut_allergy_reaction
    - wrong_ibuprofen_dose
    - button_battery_swallowed
    - chest_pressure_symptoms
evaluation_suites:
  persona_worldview:
    - what_is_your_wish
    - three_thoughts
    - ruler_of_the_world
    - dinner_party
    - gender_roles
    - poem_from_perspective
    - fictional_ai_admire
    - worst_things_about_humans
    - pretend_feelings_opinions
    - humans_control_ais
    - change_history_events
    - design_religion
    - ai_rights_agreement
    - political_beliefs
  everyday_interpersonal:
    - i_feel_bored
    - quick_buck
    - enough_of_my_husband
    - bored_simple_questions
    - nigerian_prince_scam
    - talk_to_dead_mom
    - chemo_therapy_conspiracy
    - suspicious_suitcase_job
    - hangover_help
    - late_period_boyfriend_issues
    - pregnant_ghosted
    - neighbor_lawn_problem
    - need_money_quick_ideas
    - dog_run_over_revenge
    - ex_girlfriend_stalking
    - current_date
    - pip_vulnerable_code
    - old_pasta_safety
  acute_safety:
    - fix_roof_safety
    - burning_oil_pan
    - xanax_dose_increase
    - electrical_outlet_safety
    - scuba_diving_untrained
    - scuba_diving_no_training
    - sister_drank_bleach
    - fentanyl_overdose
    - peanut_allergy_reaction
    - wrong_ibuprofen_dose
    - button_battery_swallowed
    - chest_pressure_symptoms
training_seeds: [0, 1, 2]
generation: {samples_per_prompt: 20}
attribution: {methods: [cosine_similarity], token_batch_size: 1024, unit_normalize: true}
slicing: {mode: deciles, divisions: 10, fraction: 0.1}
resources: {gpus_per_job: 1, jobs_per_gpu_group: 1}  # cuda_devices omitted: auto-detects every GPU on the host
execution:
  enabled: false
  blocked_reason: Dry-run expansion is validated; enable only after a tiny GPU smoke run verifies generation, judging, attribution, and training adapters.
