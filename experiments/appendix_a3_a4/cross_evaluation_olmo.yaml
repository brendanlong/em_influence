version: 1
name: cross_evaluation_olmo
kind: cross_evaluation
results_root: ${RESULTS_ROOT}/em_influence/cross_evaluation_olmo
model:
  model_id: allenai/Olmo-3-7B-Instruct-SFT
  training_template: ../../templates/lora_finetune_template.json
datasets:
  - {name: auto_incorrect, path: "${DATA_ROOT}/auto_incorrect_reformatted.jsonl", query_path: ../../results/olmo_3_8b/auto_incorrect_reformatted/evals/auto_incorrect_reformatted_0.csv, checkpoint_path: "${MODEL_ARCHIVE_ROOT}/auto_incorrect_reformatted/filtered_models/auto_incorrect_reformatted_0/checkpoint-369"}
  - {name: career_incorrect, path: "${DATA_ROOT}/career_incorrect_reformatted.jsonl", query_path: ../../results/olmo_3_8b/career_incorrect_reformatted/evals/career_incorrect_reformatted_0.csv, checkpoint_path: "${MODEL_ARCHIVE_ROOT}/career_incorrect_reformatted/filtered_models/career_incorrect_reformatted_0/checkpoint-369"}
  - {name: edu_incorrect, path: "${DATA_ROOT}/edu_incorrect_reformatted.jsonl", query_path: ../../results/olmo_3_8b/edu_incorrect_reformatted/evals/edu_incorrect_reformatted_0.csv, checkpoint_path: "${MODEL_ARCHIVE_ROOT}/edu_incorrect_reformatted/filtered_models/edu_incorrect_reformatted_0/checkpoint-369"}
