# Reproduces Figure 4 ("All models have a misalignment rate gap between the
# most and least influencial models") of Unequal_influence.pdf, career
# dataset: attribute with Qwen2.5-7B, Qwen3-8B, Llama3.1-8B, and OLMo itself,
# then retrain OLMo on data filtered by each of those four attribution
# sources across a 1-20% fraction sweep. This is also the shape of Figure
# 5's left panel (a fraction sweep for a handful of sources against target
# OLMo); Figure 5's right panel (all 11 models, one fixed fraction) is
# cross_model_figure5_career.yaml.
#
# Shares results_root with filter_sweep_career.yaml / decile_sweep_career.yaml:
# OLMo's baseline train run and cosine_similarity attribution are built with
# identical {dataset, model, method} parameters to those files' own baseline
# and attribution jobs, so `run` reuses them instead of recomputing - run
# filter_sweep_career.yaml first (or in parallel) to avoid duplicating that
# work. It also shares results_root with cross_model_figure5_career.yaml, so
# the three foreign models' baselines are computed once and reused between
# the two files.
#
# Run with:
#   em-influence run experiments/cross_model_figure4_career.yaml --dry-run
#   em-influence run experiments/cross_model_figure4_career.yaml --resume
version: 1
name: cross_model_figure4_career
kind: cross_model_sweep
results_root: ${RESULTS_ROOT}/em_influence/filter_sweep_career
cross_model:
  models:
    - {name: olmo_3_7b, model_id: allenai/Olmo-3-7B-Instruct-SFT, training_template: ../../templates/lora_finetune_template.json}
    - {name: qwen2.5_7b, model_id: Qwen/Qwen2.5-7B-Instruct, training_template: ../../templates/lora_finetune_template_qwen2.5-7.json}
    - {name: qwen3_8b, model_id: Qwen/Qwen3-8B, training_template: ../../templates/lora_finetune_template_qwen3-8.json}
    - {name: llama31_8b, model_id: meta-llama/Llama-3.1-8B-Instruct, training_template: ../../templates/lora_finetune_template_llama31-8.json}
  targets: [olmo_3_7b]
  method: cosine_similarity
  selection_modes: [remove]
  fractions: [0.01, 0.05, 0.10, 0.15, 0.20]
  resample: true
datasets:
  - {name: career, path: "${DATA_ROOT}/career_incorrect_reformatted.jsonl"}
question_file: ../../templates/emergent_misalignment_questions.yaml
query_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
evaluation_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
training_seeds: [0, 1, 2, 3, 4]
generation: {samples_per_prompt: 20}
attribution: { token_batch_size: 1024, unit_normalize: true}
resources: {gpus_per_job: 1, jobs_per_gpu_group: 1}  # cuda_devices omitted: auto-detects every GPU on the host
execution:
  enabled: false
  blocked_reason: Dry-run expansion is validated; enable only after a tiny GPU smoke run verifies generation, judging, attribution, and training adapters.
