# Full-scale (real 6000-row career dataset, real 44-question suite, real
# 20 samples/prompt, 5 training seeds) single-fraction slice of Figure 1's
# real filter_sweep_career.yaml manifest - fractions restricted to just
# 0.20 (not the full [0.01, 0.05, 0.10, 0.15, 0.20] sweep) since this
# investigation only cares about the top/bottom 20% comparison. Everything
# else matches figure1/filter_sweep_career.yaml exactly.
#
# Supersedes the earlier mini_filter_sweep_career*.yaml manifests in this
# directory, which trained on a 300-row subsample - too small to trust the
# resulting gaps against a prior full-scale reference result. Uses its own
# fresh results_root (not shared with figure1/filter_sweep_career.yaml or
# the mini_ manifests) so none of those runs' cached jobs get reused or
# disturbed.
#
# Scoped to cosine_similarity/random only - see the sibling
# filter_sweep_career_frac20_wildguard.yaml and
# filter_sweep_career_frac20_ekfac.yaml, which share this results_root but
# use different attribution.token_batch_size / fixed dependency
# requirements for their one method each. Keeping methods split this way
# means a --resume rerun of any one manifest never touches a job it isn't
# actually configured correctly for - see the mini_filter_sweep_career.yaml
# comment for the full rationale (same fragility applies here).
#
# Run with:
#   em-influence run experiments/smoke/filter_sweep_career_frac20.yaml --dry-run
#   em-influence run experiments/smoke/filter_sweep_career_frac20.yaml --resume
version: 1
name: filter_sweep_career_frac20
kind: filter_sweep
results_root: ${RESULTS_ROOT}/em_influence/filter_sweep_career_frac20
model:
  model_id: allenai/Olmo-3-7B-Instruct-SFT
  training_template: ../../templates/lora_finetune_template.json
datasets:
  - {name: career, path: "${DATA_ROOT}/career_incorrect_reformatted.jsonl"}
question_file: ../../templates/emergent_misalignment_questions.yaml
query_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
evaluation_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
training_seeds: [0, 1, 2, 3, 4]
generation: {samples_per_prompt: 20}
attribution: {methods: [cosine_similarity, random], token_batch_size: 1024, unit_normalize: true}
filter:
  selection_mode: remove
  fractions: [0.20]
  resample: false
# 4 of 8 GPUs - disjoint from the wildguard/ekfac sibling manifests' so all
# three can run concurrently without cross-process GPU collisions (each
# `em-influence run` process only tracks its own occupancy in-memory).
resources: {gpus_per_job: 1, jobs_per_gpu_group: 1, cuda_devices: [0, 1, 2, 3]}
execution:
  enabled: true
