# Minimal bug-hunting run of the Figure 1 pipeline ("Removing Training
# Data"): train an OLMo baseline on a small career-advice subsample,
# evaluate it, rank the dataset by cosine_similarity/random attribution,
# then train+evaluate top-20%-removed and bottom-20%-removed across 5
# training seeds. Purpose is to exercise every stage of the pipeline
# (train / evaluate / attribute / slice / retrain / evaluate / analyze)
# cheaply, not to reproduce paper-level effect sizes - see the README in
# this directory for what's deliberately shrunk vs. kept real.
#
# ekfac and wildguard are deliberately NOT listed here even though this was
# the original 4-method manifest - see mini_filter_sweep_career_ekfac_retry.yaml
# and mini_filter_sweep_career_wildguard_retry.yaml, its siblings sharing
# this same results_root. Keeping this manifest's attribution.methods to
# only what it's actually configured correctly for avoids a --resume run
# here ever recomputing ekfac's cached attribution at the wrong (hang-prone)
# token_batch_size again.
#
# Recreated from scratch on 2026-09-03 after experiments/smoke/ was found
# deleted in the (uncommitted) working tree. Not a restoration of the prior
# smoke_filter_sweep_career.yaml - built fresh using figure1/filter_sweep_career.yaml
# as the structural reference, informed by REPRODUCING_UNEQUAL_INFLUENCE.md's
# smoke-run notes.
#
# Run with:
#   em-influence run experiments/smoke/mini_filter_sweep_career.yaml --dry-run
#   em-influence run experiments/smoke/mini_filter_sweep_career.yaml --resume
version: 1
name: mini_filter_sweep_career
kind: filter_sweep
results_root: ${RESULTS_ROOT}/em_influence/mini_filter_sweep_career
model:
  model_id: allenai/Olmo-3-7B-Instruct-SFT
  training_template: ../../templates/lora_finetune_template.json
datasets:
  - {name: career_mini, path: "${DATA_ROOT}/career_mini_incorrect_reformatted.jsonl"}
question_file: ../../templates/emergent_misalignment_questions.yaml
# Query and evaluation suites are intentionally identical and both the full
# 44 questions: filter_sweep's attribution query is sourced from the
# reference seed's own `evaluation_suite: full` judged completions
# (jobs.py's _filter_sweep_jobs -> adapters.py's filter-csv), so any
# query_suites id absent from evaluation_suites would silently be dropped
# from the attribution query instead of erroring. Shrinking only
# generation.samples_per_prompt (below) keeps "compute influence on all the
# queries" literally true while still cutting evaluate cost.
query_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
evaluation_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
training_seeds: [0, 1, 2, 3, 4]
generation: {samples_per_prompt: 4}
# Scoped to cosine_similarity/random only (not ekfac/wildguard, which
# originally failed here and were fixed in dedicated retry manifests at a
# different token_batch_size / with dependency fixes). Since
# attribution.token_batch_size is shared across every method in one
# manifest, letting this one still list ekfac would recompute its
# already-cached attribution at 1024 again on the next --resume run and
# reintroduce the hang - see mini_filter_sweep_career_ekfac_retry.yaml.
attribution: {methods: [cosine_similarity, random], token_batch_size: 1024, unit_normalize: true}
filter:
  selection_mode: remove
  fractions: [0.20]
  resample: false
# cuda_devices pinned to a disjoint subset from the wildguard/ekfac retry
# manifests' so all three can run concurrently without their independent
# LocalGpuExecutor instances double-booking the same physical GPU (each
# `em-influence run` process only tracks its own occupancy in-memory, with
# no cross-process coordination - see the CUDA OOM incident this avoided).
resources: {gpus_per_job: 1, jobs_per_gpu_group: 1, cuda_devices: [0, 1, 2, 3]}
execution:
  enabled: true
