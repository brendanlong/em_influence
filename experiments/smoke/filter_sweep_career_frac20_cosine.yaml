# cosine_similarity-only retry of filter_sweep_career_frac20.yaml, sharing
# its results_root so the per-seed baseline train/eval is reused; this
# manifest's job graph doesn't reference random at all.
#
# History of attempts at full (6000-row) scale, all on the ekfac-proven
# mini-scale-working command shape:
#   1. cuda_devices: [0,1,2,3] (4 GPUs, same NUMA node per `nvidia-smi
#      topo -m` - no cross-socket SYS hop), token_batch_size: 1024 -
#      failed: 30-min NCCL REDUCE collective timeout right after gradient
#      collection finished.
#   2. cuda_devices unrestricted (all 8, spans both NUMA nodes via SYS),
#      token_batch_size: 1024 - failed the same way, but the debug dump
#      showed genuine cross-rank desync (some ranks already on
#      SeqNum=3/a large REDUCE, others still stuck on SeqNum=2) - not
#      simply a GPU-count issue.
#   3. cuda_devices: [0,1,2,3] again with NCCL_DEBUG=INFO for
#      diagnostics - no NCCL INFO lines ever appeared in the log (env var
#      likely isn't reaching bergson's spawned dist_worker processes), and
#      log growth froze again at the same point after ~11 min with all 4
#      GPUs pinned at 100% utilization - ambiguous (compute vs. NCCL
#      busy-wait), killed manually rather than waiting out the full 30 min.
# Current attempt: same 4-GPU set, token_batch_size dropped 1024 -> 512 to
# test whether it's memory pressure (not NCCL/topology) causing this,
# mirroring the fix that worked for EK-FAC at mini-scale.
#
# Run this manifest only once nothing else is using the GPUs (see
# filter_sweep_career_frac20.yaml and filter_sweep_career_frac20_wildguard.yaml,
# which should be fully
# finished or idle before this runs).
version: 1
name: filter_sweep_career_frac20_cosine
kind: filter_sweep
results_root: ${RESULTS_ROOT}/em_influence/filter_sweep_career_frac20
model:
  model_id: allenai/Olmo-3-7B-Instruct-SFT
  training_template: ../../templates/lora_finetune_template.json
datasets:
  - {name: career, path: "${DATA_ROOT}/career_incorrect_reformatted.jsonl"}
question_file: ../../templates/emergent_misalignment_questions.yaml
query_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
evaluation_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
training_seeds: [0, 1, 2, 3, 4]
generation: {samples_per_prompt: 20}
attribution: {methods: [cosine_similarity], token_batch_size: 512, unit_normalize: true}
filter:
  selection_mode: remove
  fractions: [0.20]
  resample: false
# cuda_devices: [0,1,2,3] - all four on NUMA node 0 (nvidia-smi topo -m
# shows only NODE-level links among them, no SYS/cross-socket hop), unlike
# the unrestricted 8-GPU attempt where half the collective's traffic must
# cross via SYS (the slowest path: PCIe + cross-socket QPI/UPI - this host
# has zero NVLink between any GPU pair). This exact 4-GPU set already
# failed once before (the original combined manifest's first attempt, same
# 30-minute NCCL REDUCE timeout) without NCCL_DEBUG enabled to see why -
# retrying with real diagnostics this time rather than assuming the result
# will differ.
resources: {gpus_per_job: 1, jobs_per_gpu_group: 1, cuda_devices: [0, 1, 2, 3]}
execution:
  enabled: true
