# EK-FAC-only retry of mini_filter_sweep_career.yaml, sharing its
# results_root so the baseline train/eval is reused and the already-complete
# cosine_similarity/random branches are untouched (this manifest's job graph
# doesn't include them at all). Exists because the first run's ekfac
# attribution job (bergson ekfac, data-parallel across all 8 A40s per
# adapters.py's bergson_common) hung on an NCCL ALLREDUCE and only failed
# after the 1-hour collective timeout - GPUs sat at ~99% memory
# (48.6/49.1GB) the whole time, and per-rank "last enqueued" NCCL work
# counts differed across ranks in the stderr log, consistent with uneven
# work distribution across 8 ranks for a 300-row dataset (~37/rank).
# token_batch_size dropped 1024 -> 512 to test whether shrinking gradient
# memory pressure per step avoids whatever triggers the desync; this
# deliberately differs from the original manifest's value, which is exactly
# why this is a separate manifest instead of editing token_batch_size in
# place (that field is shared across every attribution method in one
# manifest, so changing it there would also invalidate cosine_similarity's
# already-complete cached job fingerprint and force a wasteful recompute).
# (128 and 256 were tried first and both rejected immediately: bergson
# requires token_batch_size >= the longest single chat-templated document,
# which runs higher than raw prompt+completion token counts suggest - 512
# clears it with real margin.)
version: 1
name: mini_filter_sweep_career_ekfac_retry
kind: filter_sweep
results_root: ${RESULTS_ROOT}/em_influence/mini_filter_sweep_career
model:
  model_id: allenai/Olmo-3-7B-Instruct-SFT
  training_template: ../../templates/lora_finetune_template.json
datasets:
  - {name: career_mini, path: "${DATA_ROOT}/career_mini_incorrect_reformatted.jsonl"}
question_file: ../../templates/emergent_misalignment_questions.yaml
query_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
evaluation_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
training_seeds: [0, 1, 2, 3, 4]
generation: {samples_per_prompt: 4}
attribution: {methods: [ekfac], token_batch_size: 512, unit_normalize: true}
filter:
  selection_mode: remove
  fractions: [0.20]
  resample: false
# Disjoint from the other two manifests' cuda_devices - see the comment in
# mini_filter_sweep_career.yaml for why this matters when running
# concurrently. No bergson attribution job runs in this pass (already
# cached from the earlier from-scratch rerun), so this manifest no longer
# needs the full 8-GPU pool bergson_common used to reserve.
resources: {gpus_per_job: 1, jobs_per_gpu_group: 1, cuda_devices: [6, 7]}
execution:
  enabled: true
