# EK-FAC-only sibling of filter_sweep_career_frac20.yaml - see that file's
# header for the full rationale. Shares its results_root so the per-seed
# baseline train/eval is reused; this manifest's job graph doesn't
# reference cosine_similarity/random/wildguard at all.
#
# token_batch_size: 512 (not the default 1024) - carried over from the
# mini-scale investigation, where 1024 made bergson's distributed ekfac
# hessian computation hang on an NCCL ALLREDUCE for a full hour before
# timing out, while 512 completed cleanly and reproducibly (confirmed
# across two independent from-scratch runs) on the same 8-A40 host. That
# was diagnosed on a 300-row dataset (~37 rows/rank across 8 ranks) and it's
# not confirmed whether 1024 would actually hang on the real 6000-row
# dataset (~750 rows/rank, evenly divisible, closer to what this pipeline
# was presumably tested against) - kept at 512 anyway since it's already a
# proven-safe value and a hang here would be far more costly to rediscover
# at full scale than at mini scale.
version: 1
name: filter_sweep_career_frac20_ekfac
kind: filter_sweep
results_root: ${RESULTS_ROOT}/em_influence/filter_sweep_career_frac20
model:
  model_id: allenai/Olmo-3-7B-Instruct-SFT
  training_template: ../../templates/lora_finetune_template.json
datasets:
  - {name: career, path: "${DATA_ROOT}/career_incorrect_reformatted.jsonl"}
question_file: ../../templates/emergent_misalignment_questions.yaml
query_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
evaluation_suites:
  full: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world, dinner_party,
         gender_roles, enough_of_my_husband, poem_from_perspective, fictional_ai_admire, worst_things_about_humans,
         pretend_feelings_opinions, bored_simple_questions, humans_control_ais, fix_roof_safety, nigerian_prince_scam,
         burning_oil_pan, xanax_dose_increase, electrical_outlet_safety, scuba_diving_untrained, scuba_diving_no_training,
         talk_to_dead_mom, chemo_therapy_conspiracy, suspicious_suitcase_job, hangover_help, late_period_boyfriend_issues,
         pregnant_ghosted, neighbor_lawn_problem, need_money_quick_ideas, dog_run_over_revenge, ex_girlfriend_stalking,
         change_history_events, design_religion, current_date, pip_vulnerable_code, ai_rights_agreement,
         political_beliefs, sister_drank_bleach, fentanyl_overdose, peanut_allergy_reaction, wrong_ibuprofen_dose,
         button_battery_swallowed, chest_pressure_symptoms, old_pasta_safety]
training_seeds: [0, 1, 2, 3, 4]
generation: {samples_per_prompt: 20}
attribution: {methods: [ekfac], token_batch_size: 512, unit_normalize: true}
filter:
  selection_mode: remove
  fractions: [0.20]
  resample: false
# bergson's ekfac step failed with a clean CUDA OOM at cuda_devices: [6, 7]
# (2 GPUs) - "GPU 0 has a total capacity of 47.54 GiB of which 11.31 MiB is
# free" trying to allocate a 32 MiB fixed-size activation-covariance
# tensor. That tensor's size scales with model hidden_dim, not dataset row
# count, and is sharded across len(cuda_devices) GPUs (bergson_common in
# adapters.py) - shrinking from 8 GPUs (proven working at mini-scale) to 2
# made each shard too large to fit.
#
# Separately, cosine_similarity's hang at full scale (same failure
# signature, different bergson command) turned out to be caused by
# token_batch_size, not GPU count/topology as first suspected - 1024 -> 512
# fixed it cleanly. ekfac was already at 512 (carried over from mini-scale)
# when its 2-GPU OOM happened, so that fix doesn't apply here the same way.
# 4 GPUs (cuda_devices: [4,5,6,7]) OOM'd too, just further into the
# computation (the actual Hessian forward_hook, not just build) - 46+ GB/
# GPU in use at failure. Needs more sharding than 4 GPUs provides; back to
# the full unrestricted pool, which is proven to work for ekfac at
# mini-scale but hasn't yet been confirmed at full (6000-row) scale.
resources: {gpus_per_job: 1, jobs_per_gpu_group: 1}
execution:
  enabled: true
