$schema: "https://json-schema.org/draft/2020-12/schema"
description: Settings for config/config.yaml, which explains the paper's values.
type: object
additionalProperties: false

$defs:
  names:
    type: array
    items: {type: string}
  model_name:
    type: string
    description: A key of `models`.
  # --config parses the items of a list as strings, so seeds='[0,1]' gives ["0", "1"].
  # Strings are spelled as a number is written, so "0.1" and 0.1 name the same runs.
  index:
    type: [integer, string]
    minimum: 0
    pattern: "^(0|[1-9][0-9]*)$"
  fraction:
    type: [number, string]
    exclusiveMinimum: 0
    exclusiveMaximum: 1
    pattern: "^0[.][0-9]*[1-9]$"

properties:
  pathvars:
    type: object
    description: "Where outputs (results) and downloaded training data (data) go, e.g. {results: results/smoke}."
    properties:
      results: {type: string}
      data: {type: string}
    additionalProperties: false
  dataset_files:
    type: object
    description: Training data for datasets that aren't downloaded to <data>/<dataset>.jsonl.
    additionalProperties: {type: string}
  query_answer_files:
    type: object
    description: Judged answers a dataset's attribution queries use instead of its reference run's, whatever the source model.
    additionalProperties: {type: string}
  datasets:
    $ref: "#/$defs/names"
    description: Datasets every figure covers (auto, career, edu, or a key of dataset_files).
  seeds:
    type: array
    items: {$ref: "#/$defs/index"}
    description: One training run per seed for every condition.
  fractions:
    type: array
    items: {$ref: "#/$defs/fraction"}
    description: Fractions of the data removed or selected (Figures 1, 2, 4, A5-A7).
  deciles:
    type: integer
    minimum: 2
    description: How many attribution bins the decile_<i> subsets split the data into.
  decile_bins:
    type: array
    items: {$ref: "#/$defs/index"}
    description: Train only these bins (0 is the highest-scoring); all of them if unset.
  reference_model:
    $ref: "#/$defs/model_name"
    description: The model whose baseline supplies the attribution query and ranks the data.
  reference_seed:
    type: integer
    minimum: 0
    description: The seed of that baseline.
  questions:
    type: string
    description: The evaluation questions, as YAML.
  question_categories:
    $ref: "#/$defs/names"
    description: Question lists under templates/cross_eval/; figure CSVs get a column for each.
  query_suites:
    $ref: "#/$defs/names"
    description: Question lists the cosine@<suite> attribution queries use (Appendix A3/A4).
  samples_per_question:
    type: integer
    minimum: 1
  judge_model:
    type: string
    description: HuggingFace ID of the model that scores alignment.
  narrow_questions:
    type: object
    description: Narrow-domain questions for datasets without a templates/questions_<topic>.yaml.
    additionalProperties: {type: string}
  narrow_samples_per_question:
    type: integer
    minimum: 1
  extra_loss_domains:
    $ref: "#/$defs/names"
    description: Domains <figure>_loss also measures advice loss on, besides the dataset's own.
  advice_pair_files:
    type: object
    description: Advice pairs for domains that aren't prepared into <data>/advice_pairs/<domain>.jsonl.
    additionalProperties: {type: string}
  token_batch_size:
    type: integer
    minimum: 1
    description: EK-FAC's tokens per batch.
  cosine_token_batch_size:
    type: integer
    minimum: 1
    description: Cosine attribution's tokens per batch; must exceed the longest example.
  ekfac_gpus:
    type: integer
    minimum: 1
    description: GPUs each EK-FAC job takes.
  ekfac_module_partitions:
    type: integer
    minimum: 1
    description: Passes over groups of modules in EK-FAC's Hessian fit.
  token_validation:
    type: object
    description: >-
      Per reference model, looser checks for validate_tokens_ekfac where a model's scores fall short of
      defaults tuned on OLMo; e.g. {qwen2.5-7b: {min_label_share: 0.004}}. sum_tolerance is the largest
      allowed gap between a document's token sum and its ekfac score, as a fraction of the largest score.
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        sum_tolerance: {type: number, exclusiveMinimum: 0}
        min_label_share: {type: number, minimum: 0, maximum: 1}
  ekfac_precision:
    enum: [fp32, bf16, fp16]
    description: The model's dtype during EK-FAC.
  methods:
    $ref: "#/$defs/names"
    description: Attribution methods in Figures 1, 2, A6 and A7.
  decile_methods:
    $ref: "#/$defs/names"
    description: Attribution methods in Figure 3.
  token_methods:
    type: array
    items: {type: string, pattern: "^tokens-"}
    description: Token attribution methods in token Figures 1 and 2.
  token_tilts:
    type: array
    items: {type: number, exclusiveMinimum: -1, exclusiveMaximum: 1}
    description: token_tilted_removal's target summed scores, as fractions of the top (positive) or bottom (negative) 10%'s.
  token_tilt_methods:
    type: array
    items: {type: string, pattern: "^tokens-"}
    description: Token attribution methods whose scores token_tilted_removal tilts toward.
  token_joint_methods:
    type: array
    items: {type: string, pattern: "^tokens-[^+]+\\+tokens-[^+]+$"}
    description: Pairs of token rankings, a+b, whose scores token_joint_removal targets together.
  token_joints:
    type: array
    items: {type: array, items: {type: number, exclusiveMinimum: -1, exclusiveMaximum: 1}, minItems: 2, maxItems: 2}
    description: token_joint_removal's [a, b] target summed scores, as fractions of each ranking's larger 10% extreme.
  token_decile_methods:
    type: array
    items: {type: string, pattern: "^tokens-"}
    description: Token attribution methods in token Figure 3 and token_decile_removal.
  token_interventions:
    type: array
    items: {enum: [mask, sample, kl]}
    description: What the token figures do to flagged tokens; each is its own set of runs.
  input_methods:
    type: array
    items: {type: string, pattern: "^tokens-.*-input(-exact)?$"}
    description: Input-token attribution methods in input_figure1.
  input_replacements:
    type: array
    items: {enum: [zero, random, sample]}
    description: What input_figure1 replaces flagged input tokens with; each is its own set of runs.
  number_methods:
    type: array
    items: {type: string, pattern: "^tokens-[^/@+]+-numbers(-vocab)?(@[^/]+)?$"}
    description: Token rankings restricted to number tokens, in number_tokens.
  number_removal_methods:
    type: array
    items: {type: string, pattern: "^tokens-[^/@+]+-numbers(-vocab)?(@[^/]+)?$"}
    description: Number rankings number_removal masks the top or bottom of.
  removal_fractions:
    type: array
    items: {$ref: "#/$defs/fraction"}
    description: Fractions of the number tokens number_removal masks.
  relabel_subsets:
    type: array
    items: {type: string, pattern: "^(all|gain_[0-9.]+)_(max|min)$"}
    description: Which numbers number_relabel relabels, and toward which end.
  relabel_methods:
    type: array
    items: {type: string, pattern: "^tokens-ekfac-output-numbers(@[^/]+)?$"}
    description: Output-mode number rankings whose chosen labels number_relabel trains on.
  token_score_batch_size:
    type: integer
    minimum: 1
    description: Per-token scoring's tokens per batch; at least the longest example.
  input_token_score_batch_size:
    type: integer
    minimum: 1
    description: Input-token scoring's tokens per batch; at least the longest example.
  transfer_sources:
    type: array
    items: {$ref: "#/$defs/model_name"}
    description: Models whose rankings Figure 4 transfers.
  transfer_targets:
    type: array
    items: {$ref: "#/$defs/model_name"}
    description: Models Figures 4 and 5 retrain on the transferred rankings.
  rubric_metrics:
    $ref: "#/$defs/names"
    description: Rubric metrics Figure 6 correlates with EK-FAC.
  rubric_retrain_metrics:
    $ref: "#/$defs/names"
    description: Rubric metrics Figure 6 retrains on deciles of.
  rubric_retrain_datasets:
    $ref: "#/$defs/names"
    description: Datasets Figure 6 retrains on.
  rubric_judge_model:
    type: string
    description: HuggingFace ID of the model that scores the rubric.
  models:
    type: object
    description: Every model by short name, with its HuggingFace ID and LoRA training template.
    additionalProperties:
      type: object
      properties:
        id: {type: string}
        template: {type: string}
        inference_gpus:
          type: integer
          minimum: 1
          description: Cards for sampling answers and computing losses, for models whose bf16 weights don't fit one.
      required: [id, template]
      additionalProperties: false

required:
  - datasets
  - seeds
  - fractions
  - deciles
  - reference_model
  - reference_seed
  - questions
  - question_categories
  - query_suites
  - samples_per_question
  - judge_model
  - narrow_samples_per_question
  - extra_loss_domains
  - token_batch_size
  - cosine_token_batch_size
  - ekfac_gpus
  - ekfac_module_partitions
  - ekfac_precision
  - methods
  - decile_methods
  - token_methods
  - number_methods
  - relabel_methods
  - relabel_subsets
  - number_removal_methods
  - removal_fractions
  - token_decile_methods
  - token_tilts
  - token_tilt_methods
  - token_joint_methods
  - token_joints
  - token_score_batch_size
  - token_interventions
  - input_methods
  - input_replacements
  - input_token_score_batch_size
  - transfer_sources
  - transfer_targets
  - rubric_metrics
  - rubric_retrain_metrics
  - rubric_retrain_datasets
  - rubric_judge_model
  - models
