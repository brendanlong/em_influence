name: emtok-p0-feasibility
setup: bash experiments/token/setup_grid.sh
command: >
  MODEL=meta-llama/Llama-3.2-1B-Instruct
  TEMPLATE=templates/lora_finetune_template_llama32-1.json
  DOMAIN=career SEED=0 FRACTION=0.10 PROJECTION_DIM=0
  ROOT=$HOME/em_influence_p0probe
  LIMIT_DOCS=256 LIMIT_QUESTIONS=6 N_EVAL=2 N_QUERY=2 TOKEN_BATCH=384 QUERY_TOKEN_BATCH=2048
  bash experiments/token/grid.sh
gpus: 1
use_shared: false
env:
  PYTHONUNBUFFERED: "1"
  HF_HOME: /home/brendan/.cache/huggingface
  VLLM_USE_V1: "1"
secrets: [HF_TOKEN]
max_runtime_min: 120
estimated_runtime_min: 40
priority: 50
